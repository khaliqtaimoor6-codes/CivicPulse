[project]
name = "civicpulse-backend"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
	"fastapi~=0.115.0",
	"uvicorn[standard]~=0.30.0",
	"sqlalchemy~=2.0.0",
	"alembic~=1.13.0",
	"psycopg2-binary~=2.9.0",
	"pydantic>=2,<3",
	"pydantic-settings~=2.6.0",
	"python-dotenv~=1.0.0",
	"groq~=1.7.0",
	"redis~=5.2.0",
	"prometheus-client~=0.21.0",
]

[project.optional-dependencies]
dev = [
	"pytest~=8.3.0",
	"httpx~=0.27.0",
	"pytest-cov~=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
