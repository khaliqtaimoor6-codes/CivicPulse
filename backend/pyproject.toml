[project]
name = "civicpulse-backend"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
	"fastapi~=0.115.0",
	"uvicorn[standard]~=0.30.0",
	"sqlalchemy~=2.0.0",
	"alembic~=1.13.0",
	"psycopg2-binary~=2.9.0",
	"pydantic>=2,<3",
	"pydantic-settings~=2.6.0",
	"python-dotenv~=1.0.0",
	"groq~=1.7.0",
	"httpx~=0.27.0",
	"redis~=5.2.0",
	"prometheus-client~=0.21.0",
]

[project.optional-dependencies]
dev = [
	"pytest~=8.3.0",
	"httpx~=0.27.0",
	"pytest-cov~=5.0.0",
	"mypy~=1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Type checking covers the whole `app/` package, not a single subdirectory. An
# earlier revision checked only `app/providers/triage` with
# `--follow-imports=skip`, which passed while sixteen real type errors sat
# unexamined in `routes/`, `services/` and `repositories/`. Imports are now
# followed for real, so a wrong signature in one module is caught in another.
[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# redis-py ships type stubs whose sync `Redis` methods are declared as
# `Awaitable[Any] | Any` (the union covers the `redis.asyncio` client in the same
# stub set). Type-checking `RedisCacheProvider.get_triage_result` against those
# stubs makes a plain `self.redis.get(...)` look like a coroutine. The client is
# genuinely synchronous -- `app/routes/stats.py` calls `cache.get(...)` in a
# `def` handler and the test suite is green -- so the stub, not the call site,
# is what is wrong. Skipping the stubs restores the correct `Any`-typed client
# instead of forcing `cast()` noise at every call site.
[[tool.mypy.overrides]]
module = ["redis.*", "prometheus_client.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.setuptools.packages.find]
include = ["app*"]
