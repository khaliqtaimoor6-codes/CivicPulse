# Fly.io app definition for the FastAPI backend.
#
# The image built by backend/Dockerfile is deployed as-is. Nothing here
# translates it into a platform-specific build, which is the reason for
# choosing a container host over a function platform: the same multi-stage
# image that compose and Kubernetes run is what gets published.

app = "civicpulse-backend"
primary_region = "iad"

# Dockerfile paths in this file are resolved by flyctl relative to the working
# directory, which is the build context, not relative to this file. So this is
# deployed as `fly deploy backend --config ../deploy/fly/backend.toml` from the
# repository root, and "Dockerfile" means backend/Dockerfile. The working
# directory argument is what sets the build context, which is why there is no
# `context` key here.
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  TRIAGE_PROVIDER = "simulated"
  RATE_LIMIT_PER_MINUTE = "60"

# DATABASE_URL and REDIS_URL are not set here. They come from the managed
# instances attached in the README, which write them as secrets:
#
#   fly postgres attach --app civicpulse-backend civicpulse-db
#   fly redis attach --app civicpulse-backend
#
# LLM_API_KEY is only read when TRIAGE_PROVIDER is "llm", so it is left unset
# rather than defaulted to a placeholder. See .env.example.

# Runs once per deploy, after the new image is built and before any new
# instance takes traffic. This is the container-host equivalent of
# k8s/base/migration-job.yaml, and it exists for the same reason: the image's
# CMD is uvicorn, so nothing applies the schema on startup, and a deploy that
# skipped this would run new code against the previous schema.
[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[http_service]
  internal_port = 8000
  force_https = true
  # Scales to zero when the queue is empty, which is the behaviour a civic
  # complaint system actually wants outside working hours.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # The same endpoint compose.prod.yaml and the k8s probes use, so a failure
  # means the same thing in all three places.
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # Matches the 320Mi the k8s HPA and the VPA recommendation were tuned
  # against. The compose.prod.yaml figure is 320M (decimal), which is tighter.
  memory = "512mb"
