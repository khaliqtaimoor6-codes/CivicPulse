name: CD

on:
  push:
    branches: [main]

# Default to the least privilege for every job. build-push and deploy-k8s widen
# this individually, and only for the registry access they actually need.
permissions:
  contents: read

jobs:
  test:
    name: Re-verify merged main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+psycopg2://civicpulse:civicpulse_ci_password@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse_ci_password
          POSTGRES_DB: civicpulse
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U civicpulse -d civicpulse"
          --health-interval=5s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and type-check
        working-directory: backend
        run: |
          # -e, deliberately. app/ has no __init__.py, so it is a namespace
          # package: a non-editable install puts a *copy* of app in
          # site-packages, and checks then run against that copy rather than the
          # checked-out source. See the Backend tests note below.
          python -m pip install -e ".[dev]" ruff==0.11.2 mypy==1.15.0
          ruff check app tests
          # Scope comes from [tool.mypy] in backend/pyproject.toml (`files =
          # ["app"]`), kept identical to ci.yml by reading the same config
          # rather than repeating flags here.
          mypy
      - name: Backend tests
        working-directory: backend
        run: |
          # Must match ci.yml: `pip install -e`, not `pip install`. app/ is a
          # namespace package and backend/tests/ has no __init__.py, so pytest
          # prepends backend/tests to sys.path rather than backend/. With a
          # non-editable install `app` resolves to the site-packages copy, and
          # coverage.py ends up measuring a tree that never executes: all 23
          # tests passed but coverage reported "No data was collected" and
          # TOTAL 0.00%, failing --cov-fail-under=65. This is what broke the
          # first real CD run.
          python -m pip install -e ".[dev]"
          alembic upgrade head
          pytest --cov=app --cov-fail-under=65
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm run test

  build-push:
    name: Build, publish, and attest images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.digests.outputs.backend_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-backend
        run: |
          docker buildx build ./backend --push --provenance=false \
            --tag "$IMAGE:${GITHUB_SHA}" --tag "$IMAGE:latest" \
            --metadata-file backend-metadata.json
      - name: Build and push frontend
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend
        run: |
          docker buildx build ./frontend --push --provenance=false \
            --tag "$IMAGE:${GITHUB_SHA}" --tag "$IMAGE:latest" \
            --metadata-file frontend-metadata.json
      - name: Generate image SBOMs
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
      - uses: anchore/sbom-action@v0.17.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
      # `set -euo pipefail` matters here. The jq call sits inside a command
      # substitution inside an echo, so without it a jq failure is swallowed and
      # the step still reports success while writing an empty value. That is
      # exactly what happened: the single-quoted string '.\"containerimage.digest\"'
      # passes the backslashes through to jq, which fails to compile, so both
      # digests were published empty.
      #
      # An empty digest is not caught downstream either. `kustomize edit set image
      # "repo@"` exits 0 and simply drops the tag, and kustomize's implicit
      # default tag is `placeholder` -- so the manifests rendered
      # `...civicpulse-backend:placeholder`, apply succeeded, and the deploy
      # failed minutes later on ImagePullBackOff with "0 of 2 updated replicas"
      # and no hint that a digest had ever gone missing.
      - name: Publish digests as job outputs
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          read_digest() {
            # The metadata key contains dots, so it needs bracket notation.
            # `.\"containerimage.digest\"` is a jq compile error, not an escape.
            local file="$1" name="$2" value
            value="$(jq -r '.["containerimage.digest"]' "$file")"
            if [[ ! "$value" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$name digest is '${value}', expected sha256:<64 hex> from $file" >&2
              jq -c 'keys' "$file" >&2 || true
              return 1
            fi
            printf '%s' "$value"
          }
          backend_digest="$(read_digest backend-metadata.json backend)"
          frontend_digest="$(read_digest frontend-metadata.json frontend)"
          {
            echo "backend_digest=$backend_digest"
            echo "frontend_digest=$frontend_digest"
          } >> "$GITHUB_OUTPUT"
          echo "published backend  $backend_digest"
          echo "published frontend $frontend_digest"
      - uses: actions/upload-artifact@v4
        with:
          name: image-sboms-${{ github.sha }}
          path: '*-sbom.cdx.json'

  deploy-k8s:
    name: Deploy to ephemeral Kubernetes
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to pull the images build-push just published. GHCR packages are
      # private by default, so without this the rollouts cannot start.
      packages: read
    env:
      # No LLM key exists in CI secrets, so the deployed backend must not expect
      # one. k8s/base/configmap.yaml also sets simulated; the smoke test asserts
      # on triaged_by so a silent change of provider is caught rather than assumed.
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4

      # k3d is installed from a pinned release tarball rather than a k3d action:
      # there is no k3d-io/k3d-action repository to pin, and @main would float.
      # This also matches how kustomize is already installed in this workflow.
      - name: Install pinned kustomize and k3d
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 \
            -o "$RUNNER_TEMP/k3d"
          chmod +x "$RUNNER_TEMP/k3d"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # k3d, not kind: k8s/base/network-policy.yaml pins the kube-dns ClusterIP
      # to 10.43.0.10/32, which is the k3s service CIDR. On kind the service CIDR
      # is 10.96.0.0/16, so that DNS egress rule would not match and the backend
      # could not resolve postgres or redis. The CNI evaluates egress pre-DNAT,
      # which is why the ClusterIP has to be allowed explicitly at all.
      - name: Create ephemeral k3d cluster
        shell: bash
        run: |
          set -euo pipefail
          k3d cluster create civicpulse \
            --image rancher/k3s:v1.35.5-k3s1 \
            --port 80:80@loadbalancer \
            --wait
          kubectl config use-context k3d-civicpulse
          kubectl cluster-info
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Log in to GHCR for image pulls
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote immutable image digests
        working-directory: k8s/overlays/prod
        shell: bash
        env:
          BACKEND_DIGEST: ${{ needs.build-push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build-push.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          # Same guard as in the build job, and deliberately repeated: these are
          # two different jobs, and this is the last point at which a wrong image
          # can be caught before it reaches a cluster. An empty digest makes
          # `kustomize edit set image "repo@"` exit 0 while dropping the tag,
          # and kustomize then renders the implicit default `:placeholder` -- so
          # apply succeeds and the job fails later on ImagePullBackOff with
          # "0 of 2 updated replicas" and nothing pointing at the real cause.
          for pair in "backend:${BACKEND_DIGEST}" "frontend:${FRONTEND_DIGEST}"; do
            name="${pair%%:*}"; digest="${pair#*:}"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::build-push did not publish a $name digest (got '${digest}')" >&2
              exit 1
            fi
          done
          kustomize edit set image \
            "ghcr.io/${{ github.repository_owner }}/civicpulse-backend@${BACKEND_DIGEST}"
          kustomize edit set image \
            "ghcr.io/${{ github.repository_owner }}/civicpulse-frontend@${FRONTEND_DIGEST}"

          # Verify the rendered manifests rather than trusting the exit code, so
          # a digest that is present but not actually applied is still caught.
          # Parsed with python3 rather than yq so this depends only on what an
          # ubuntu runner is guaranteed to have.
          kustomize build . > "$RUNNER_TEMP/rendered.yaml"
          python3 - "$RUNNER_TEMP/rendered.yaml" <<'PY'
          import sys, yaml
          want = {}
          for doc in yaml.safe_load_all(open(sys.argv[1])):
              if not doc or doc.get('kind') != 'Deployment':
                  continue
              for c in doc['spec']['template']['spec']['containers']:
                  if c['name'] in ('backend', 'frontend'):
                      want[c['name']] = c['image']
          bad = [f"{n} -> {i}" for n, i in want.items() if '@sha256:' not in str(i)]
          if bad or len(want) != 2:
              print(f"::error::not digest-pinned: {bad or 'a workload is missing'}",
                    file=sys.stderr)
              sys.exit(1)
          for n, i in sorted(want.items()):
              print(f"  {n} -> {i}")
          PY
          echo "deployed commit ${GITHUB_SHA} as immutable digests:"

      # Secret before apply, matching the ordering the manifests require: the
      # deployments reference civicpulse-secrets, so applying them first would
      # leave the pods stuck on CreateContainerConfigError.
      #
      # The database password is generated per run rather than read from a
      # repository secret. This cluster is created and destroyed inside one job
      # and nothing durable is written to it, so there is nothing for a
      # long-lived secret to protect; requiring one only meant the job failed
      # whenever the repository happened to have no POSTGRES_* secret
      # configured. A fresh random value per run is both more secure and
      # self-contained.
      - name: Apply registry credentials and runtime Secret
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          # TRIAGE_PROVIDER is 'simulated' for this job, so no LLM key is needed
          # and none is required to be configured on the repository.
          LLM_API_KEY="${LLM_API_KEY:-}"
          POSTGRES_USER=civicpulse
          POSTGRES_DB=civicpulse
          POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          echo "generated an ephemeral database password for this run"
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr -n civicpulse \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic civicpulse-secrets -n civicpulse \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=DATABASE_URL="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
            --from-literal=REDIS_URL='redis://redis:6379/0' \
            --from-literal=LLM_API_KEY="$LLM_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      # k8s/base/backend-vpa.yaml is part of the base, so every overlay including
      # prod references the VPA kind. The CRD is not a k3s or kubeadm default, so
      # without this the very first `kubectl apply` of the overlay fails with
      # "no matches for kind VerticalPodAutoscaler" and every later step is
      # skipped. Pinned to a release tag rather than master so a change upstream
      # cannot alter what a merge deploys.
      - name: Install the VPA CustomResourceDefinition
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.5.0/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml" \
            | kubectl apply -f -
          kubectl wait --for=condition=Established \
            crd/verticalpodautoscalers.autoscaling.k8s.io --timeout=60s

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for rollouts
        shell: bash
        run: |
          set -uo pipefail
          for target in statefulset/postgres deployment/redis \
                        deployment/civicpulse-backend deployment/civicpulse-frontend; do
            if kubectl rollout status "$target" -n civicpulse --timeout=180s; then
              continue
            fi
            # "timed out waiting for the condition" says nothing about why, and
            # the causes are completely different bugs: ImagePullBackOff, missing
            # Secret keys, a probe that never passes, a crash on boot. Dump the
            # real reason instead of leaving it to be guessed at.
            echo "::group::why $target never became ready"
            kubectl get pods -n civicpulse -o wide || true
            kubectl get events -n civicpulse --sort-by=.lastTimestamp | tail -25 || true
            kubectl describe -n civicpulse "${target##*/}" 2>/dev/null | sed -n '/Conditions:/,$p' || true
            prefix="${target##*/}"
            for pod in $(kubectl get pods -n civicpulse -o name | grep "/${prefix}"); do
              echo "--- $pod ---"
              kubectl describe -n civicpulse "$pod" | sed -n '/^Events:/,$p' || true
              kubectl logs -n civicpulse "$pod" --tail=40 --all-containers 2>&1 || true
            done
            echo "::endgroup::"
            exit 1
          done

      # Postgres is up at this point but the schema is not: nothing else in the
      # deploy path runs alembic, and the API smoke test below POSTs a
      # complaint, which needs the `complaints` table. Without this step the
      # run gets past the Ingress test (that endpoint touches no tables) and
      # dies on a 500 here, after the images and rollouts have already
      # succeeded.
      #
      # The Job itself is applied by "Apply manifests"; this step only waits
      # for it. It dumps the Job rather than timing out silently so a bad
      # revision is readable from the run page instead of being reproduced
      # locally, and it checks the Failed condition so an image-pull or
      # connection failure surfaces immediately instead of holding the 180s.
      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          until kubectl -n civicpulse wait --for=condition=complete \
              job/civicpulse-migrate --timeout=5s >/dev/null 2>&1; do
            if kubectl -n civicpulse get job civicpulse-migrate \
                -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' \
                2>/dev/null | grep -q True; then
              echo "migration job reported Failed" >&2
              kubectl -n civicpulse describe job civicpulse-migrate >&2 || true
              kubectl -n civicpulse logs job/civicpulse-migrate --tail=50 >&2 || true
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "timed out waiting for migrations" >&2
              kubectl -n civicpulse describe job civicpulse-migrate >&2 || true
              kubectl -n civicpulse logs job/civicpulse-migrate --tail=50 >&2 || true
              exit 1
            fi
            sleep 3
          done
          echo "alembic is at head; the API smoke test can now write a row"

      - name: Smoke test the Ingress
        shell: bash
        run: |
          set -euo pipefail
          # k3d maps the loadbalancer port, so Traefik answers on localhost and
          # routes by the Host header declared in k8s/base/ingress.yaml.
          deadline=$((SECONDS + 90))
          until curl --fail --silent -H 'Host: civicpulse.local' \
              http://127.0.0.1/api/meta/providers >/dev/null; do
            if (( SECONDS >= deadline )); then
              kubectl get pods -n civicpulse -o wide
              kubectl logs -n civicpulse deploy/traefik --tail=50 || true
              exit 1
            fi
            sleep 3
          done
          echo "ingress routed /api/meta/providers through Traefik"

      - name: Smoke test the API
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward -n civicpulse svc/civicpulse-backend 18000:8000 >/tmp/port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 60))
          until curl --fail --silent http://127.0.0.1:18000/health >/dev/null; do
            if (( SECONDS >= deadline )); then cat /tmp/port-forward.log; exit 1; fi
            sleep 2
          done
          complaint=$(curl --fail --silent -X POST http://127.0.0.1:18000/api/complaints \
            -H 'Content-Type: application/json' \
            -d '{"text":"A pothole is blocking the road near the library","location":"Civic Center"}')
          id=$(jq -r '.id' <<<"$complaint")
          test -n "$id" && test "$id" != null
          fetched=$(curl --fail --silent "http://127.0.0.1:18000/api/complaints/$id")
          jq -e '.category and .priority' <<<"$fetched" >/dev/null
          # Proves the round trip persisted and that no LLM provider was needed.
          jq -e '.triaged_by == "simulated"' <<<"$fetched" >/dev/null
          jq '{id, category, priority, triaged_by, triage_latency_ms}' <<<"$fetched"

      - name: Print HPA evidence
        run: kubectl get hpa -n civicpulse
