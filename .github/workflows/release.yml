name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish semver release
    runs-on: ubuntu-latest
    # Repeated at job level so the grant is explicit where it is used rather
    # than inherited, matching the least-privilege pattern in ci.yml and cd.yml.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A tag can be placed on any commit, including a branch commit that never
      # reached main. Releasing one of those would publish images built from code
      # that CI never approved, so fail fast and visibly instead.
      - name: Verify the tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            echo "::error::Release it from a merged main commit, or the published images would not match main."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME -> $GITHUB_SHA is on main"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned images
        env:
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Docker tags cannot carry a leading "v" by convention here, so v0.1.0
          # publishes as :0.1.0. `latest` is deliberately NOT moved: CD owns that
          # tag and ties it to main, and a release cut from an older commit would
          # otherwise walk `latest` backwards.
          # shellcheck disable=SC2153  # VERSION is injected via the env: block above
          version="${VERSION#v}"
          docker buildx build ./backend --push --provenance=false \
            --tag "ghcr.io/${OWNER}/civicpulse-backend:${version}" \
            --metadata-file backend-metadata.json
          docker buildx build ./frontend --push --provenance=false \
            --tag "ghcr.io/${OWNER}/civicpulse-frontend:${version}" \
            --metadata-file frontend-metadata.json
          echo "published ${VERSION} as :${version} from commit ${GITHUB_SHA}"
          echo "  backend  $(jq -r '.\"containerimage.digest\"' backend-metadata.json)"
          echo "  frontend $(jq -r '.\"containerimage.digest\"' frontend-metadata.json)"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.2.2
        with:
          generate_release_notes: true
