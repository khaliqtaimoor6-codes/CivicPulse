name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish semver release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned images
        env:
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${VERSION#v}"
          docker buildx build ./backend --push --provenance=false \
            --tag "ghcr.io/${OWNER}/civicpulse-backend:${version}"
          docker buildx build ./frontend --push --provenance=false \
            --tag "ghcr.io/${OWNER}/civicpulse-frontend:${version}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.2.2
        with:
          generate_release_notes: true
