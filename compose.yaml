services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse_dev_password
      POSTGRES_DB: civicpulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    networks:
      - backend-net

  backend:
    build: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://civicpulse:civicpulse_dev_password@postgres:5432/civicpulse
      REDIS_URL: redis://redis:6379/0
      TRIAGE_PROVIDER: simulated
      RATE_LIMIT_PER_MINUTE: 30
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    networks:
      - frontend-net
      - backend-net

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - frontend-net

volumes:
  postgres-data:

networks:
  frontend-net:
  backend-net:
