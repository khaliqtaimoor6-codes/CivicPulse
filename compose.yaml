services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse_dev_password
      POSTGRES_DB: civicpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot schema migration, mirroring k8s/base/migration-job.yaml.
  #
  # This is deliberately a separate container rather than a step inside the
  # backend's startup: the brief forbids schema DDL in application startup
  # code, and the Kubernetes side already models this as a Job that must
  # succeed before the Deployment rolls. Running `alembic upgrade head` here
  # instead means a fresh clone needs one `docker compose up` to reach a
  # migrated, queryable database, and the exact same migration is exercised
  # in both deployment modes. It is idempotent: on an already-migrated volume
  # it exits 0 immediately.
  migrate:
    build: ./backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Both are required, not optional, and Redis is deliberately included
      # even though alembic never touches it. Settings declares database_url
      # and redis_url with no default and get_settings() raises at import time
      # -- which happens inside alembic's own env.py:17 -- if either is absent.
      # k8s/base/migration-job.yaml passes the same pair for the same reason.
      DATABASE_URL: postgresql+psycopg2://civicpulse:civicpulse_dev_password@postgres:5432/civicpulse
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command:
      - alembic
      - upgrade
      - head
    networks:
      - internal

  # Optional local model runner. It sits behind a profile so that the default
  # `docker compose up` does not pull a multi-gigabyte image and start a
  # service the demo never talks to. Enable it explicitly when you actually
  # want a local model: `docker compose --profile ollama up -d`.
  ollama:
    image: ollama/ollama:0.34.4
    profiles:
      - ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - internal
    healthcheck:
      # `ollama list` talks to the server on 11434, so it is a real readiness
      # check rather than just a process-exists check.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://civicpulse:civicpulse_dev_password@postgres:5432/civicpulse
      REDIS_URL: redis://redis:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-simulated}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      # Read from the host .env only when TRIAGE_PROVIDER=llm. Passed through
      # here so the hosted Groq path documented in the README actually works in
      # the dev stack; compose.prod.yaml already wires the same key. The value
      # is never committed -- it comes from the environment at up-time.
      LLM_API_KEY: ${LLM_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: 30
      CORS_ORIGIN: http://localhost:5173
    # Development only. Mounting the source lets `uvicorn --reload` below pick
    # up an edit without a rebuild, which is the whole point of a dev stack.
    #
    # This is deliberately absent from compose.prod.yaml, and the reason is not
    # stylistic: in production the image is the immutable unit of deployment.
    # A bind mount would let a running container's code drift away from the
    # tag it was rolled out from, so "what is production running?" could no
    # longer be answered with a commit SHA -- see docs/adr/0003-deploy-by-sha.
    # It also breaks the multi-stage image story, since the host tree carries
    # no dependency install and would shadow the venv built into the image.
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    # --reload is dev-only for the same reason. The image's own CMD stays
    # reload-free so the production image never runs a file watcher.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --timeout-graceful-shutdown
      - "10"
    ports:
      - "8000:8000"
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend:8000
    ports:
      - "5173:80"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
  ollama_models:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
