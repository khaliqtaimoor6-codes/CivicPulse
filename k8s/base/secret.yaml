# This Secret is intentionally NOT part of the Kustomize resource list.
#
# Do not add it to kustomization.yaml and do not commit real values here.
# A Secret applied by `kubectl apply -k` would overwrite the live runtime
# Secret on every deploy, resetting real credentials back to placeholders.
#
# The runtime Secret is created out-of-band, before manifests are applied:
#
#   kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic civicpulse-secrets -n civicpulse \
#     --from-literal=POSTGRES_USER="$POSTGRES_USER" \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#     --from-literal=POSTGRES_DB="$POSTGRES_DB" \
#     --from-literal=DATABASE_URL="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
#     --from-literal=REDIS_URL='redis://redis:6379/0' \
#     --from-literal=LLM_API_KEY="$LLM_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# CI does this in .github/workflows/cd.yml before `kubectl apply -k`.
# Order matters: the Secret must exist before the postgres StatefulSet starts,
# otherwise the PVC is initialised with placeholder credentials and postgres
# will not start against the existing data directory.
#
# Required keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL,
#                REDIS_URL, LLM_API_KEY
