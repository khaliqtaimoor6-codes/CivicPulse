apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicpulse-frontend
  namespace: civicpulse
  labels:
    app: civicpulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: civicpulse-frontend
  template:
    metadata:
      labels:
        app: civicpulse-frontend
    spec:
      containers:
        - name: frontend
          # CD replaces this placeholder with an immutable image reference later.
          image: ghcr.io/khaliqtaimoor6-codes/civicpulse-frontend:placeholder
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BACKEND_HOST
              value: civicpulse-backend.civicpulse.svc.cluster.local:8000
          # nginx serves the SPA on 80; a response from "/" means the process is
          # alive and proxying. liveness restarts a wedged nginx; readiness
          # keeps the pod out of the Service until it can serve.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi