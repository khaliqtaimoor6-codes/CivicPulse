apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: civicpulse
resources:
  - ../../base
images:
  - name: ghcr.io/khaliqtaimoor6-codes/civicpulse-backend
    newName: civicpulse-backend
    newTag: dev
  - name: ghcr.io/khaliqtaimoor6-codes/civicpulse-frontend
    newName: civicpulse-frontend
    newTag: dev
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: civicpulse-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 150m
            memory: 192Mi
          limits:
            # CPU limit raised 350m -> 400m. The live VPA recommender now
            # reports 379m CPU / 250Mi memory against this Deployment, so the
            # previous 350m sat *below* observed usage and risked throttling.
            # 400m keeps headroom over the recommendation. Memory stays 320Mi:
            # the VPA's 250Mi is a recommendation, and CPU was the tight
            # dimension, not memory. Re-check with `kubectl get vpa` before
            # the next tuning pass rather than assuming these stay valid.
            cpu: 400m
            memory: 320Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: civicpulse-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
