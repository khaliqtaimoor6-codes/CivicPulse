<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CivicPulse reads a civic complaint, routes it to the right city team, and keeps a public trail to resolution."
    />
    <meta name="theme-color" content="#070e0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f4ee" media="(prefers-color-scheme: light)" />
    <link
      rel="preload"
      href="/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>CivicPulse | City services, clearer</title>
    <script>
      // Runs before first paint so the page never renders in the wrong theme.
      // The markup defaults to dark, which is the brand look, and the stored
      // preference or the system setting overrides it from here.
      (function () {
        var theme = "dark";
        try {
          var stored = window.localStorage.getItem("civicpulse-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
        } catch (error) {
          // Storage can be blocked outright. The default above still holds.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
